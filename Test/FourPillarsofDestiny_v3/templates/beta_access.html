<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>초대 베타 · {{ app_name }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff9f6;
      --card: rgba(255,255,255,.94);
      --ink: #352d33;
      --muted: #776b72;
      --line: #ecdfe4;
      --accent: #eb7f9b;
      --accent-dark: #c95d78;
      --shadow: 0 24px 60px rgba(82, 55, 68, .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 218, 226, .78), transparent 30%),
        radial-gradient(circle at 86% 18%, rgba(217, 235, 255, .72), transparent 31%),
        linear-gradient(150deg, #fff9f6 0%, #fffefe 50%, #f8fbff 100%);
      color: var(--ink);
    }
    .card {
      width: min(100%, 430px);
      background: var(--card);
      border: 1px solid rgba(236,223,228,.92);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 34px 30px 30px;
      backdrop-filter: blur(12px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff0f4;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: -.02em;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.16;
      letter-spacing: -.045em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
      letter-spacing: -.015em;
    }
    form { margin-top: 25px; }
    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 750;
      font-size: 14px;
    }
    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    input:focus {
      border-color: #ef9eb1;
      box-shadow: 0 0 0 4px rgba(235,127,155,.13);
    }
    button {
      width: 100%;
      height: 52px;
      margin-top: 13px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #ef91aa, #df6f8b);
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(205, 92, 123, .19);
    }
    button:hover { filter: brightness(.985); }
    .error {
      margin: 14px 0 0;
      padding: 11px 13px;
      border-radius: 13px;
      background: #fff1f0;
      color: #ad3f3f;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.5;
    }
    .foot {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      line-height: 1.55;
      color: #93868d;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">✦ 초대 베타</span>
    <h1>초대받은 분만<br>먼저 만나볼 수 있어요.</h1>
    <p>현재는 소규모 무료 베타로 운영하고 있습니다. 전달받은 초대코드를 입력하면 바로 이용할 수 있어요.</p>

    <form method="post" action="{{ url_for('beta_access') }}" autocomplete="off">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label for="invite_code">초대코드</label>
      <input id="invite_code" name="invite_code" type="password" inputmode="text" autocomplete="one-time-code" required autofocus maxlength="128" placeholder="초대코드를 입력해 주세요">
      <button type="submit">베타 시작하기</button>
    </form>

    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

    <div class="foot">
      인증은 이 브라우저에서 최대 {{ session_days }}일 동안 유지됩니다. 무료 베타 중에는 기능·화면이 예고 없이 변경될 수 있습니다.
    </div>
  </main>
</body>
</html>
